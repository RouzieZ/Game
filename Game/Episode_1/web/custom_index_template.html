<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body, #canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0d1116; }
    #canvas { display: block; touch-action: none; }
  </style>
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <script>
    window.pzYandexBridge = {
      ysdk: null, player: null, initPromise: null, readyRequested: false, gameplayActive: false,
      init() {
        if (this.initPromise) return this.initPromise;
        if (!window.YaGames) return Promise.resolve(false);
        this.initPromise = window.YaGames.init().then(async (ysdk) => {
          this.ysdk = ysdk;
          try { this.player = await ysdk.getPlayer({ scopes: false }); } catch (error) { console.warn(error); }
          if (this.readyRequested) this.ysdk.features.LoadingAPI?.ready();
          if (this.gameplayActive) this.ysdk.features.GameplayAPI?.start();
          return true;
        }).catch((error) => { console.error(error); return false; });
        return this.initPromise;
      },
      gameReady() { this.readyRequested = true; if (this.ysdk) this.ysdk.features.LoadingAPI?.ready(); },
      gameplayStart() { this.gameplayActive = true; if (this.ysdk) this.ysdk.features.GameplayAPI?.start(); },
      gameplayStop() { this.gameplayActive = false; if (this.ysdk) this.ysdk.features.GameplayAPI?.stop(); },
      showFullscreenAd() {
        if (!this.ysdk?.adv) return;
        this.gameplayStop();
        this.ysdk.adv.showFullscreenAdv({ callbacks: { onClose: () => this.gameplayStart(), onError: () => this.gameplayStart() } });
      },
      showRewardedAd() {
        if (!this.ysdk?.adv) return;
        this.gameplayStop();
        this.ysdk.adv.showRewardedVideo({ callbacks: { onClose: () => this.gameplayStart(), onError: () => this.gameplayStart() } });
      },
      async saveData(data) { if (!this.player) return false; await this.player.setData(data, true); return true; },
      async requestData() { if (!this.player) return null; return await this.player.getData(); }
    };
  </script>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas">Ваш браузер не поддерживает Canvas.</canvas>
  <noscript>Для запуска игры необходим JavaScript.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame({ canvas: document.getElementById("canvas") }).catch(console.error);
  </script>
</body>
</html>
